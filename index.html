function exportData(type) {
  let dataStr, fileName;
  if (type === 'students') {
    dataStr = JSON.stringify(DB.students, null, 2);
    fileName = 'students.json';
  } else if (type === 'subjects') {
    dataStr = JSON.stringify(DB.subjects, null, 2);
    fileName = 'subjects.json';
  } else if (type === 'timetable') {
    dataStr = JSON.stringify(DB.timetable, null, 2);
    fileName = 'timetable.json';
  } else if (type === 'backup') {
    dataStr = JSON.stringify(DB, null, 2);
    fileName = 'cr_attendance_backup.json';
  }
  const blob = new Blob([dataStr], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✓ Exported ' + fileName, 'success');
}


function initiateImport(type) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        validateAndPreviewImport(type, data);
      } catch(err) {
        showToast('Invalid JSON file.', 'error');
      }
    };
    reader.readAsText(file);
  });
  input.click();
}


function validateAndPreviewImport(type, data) {
  let isValid = false;
  let previewDetails = {};
  let processedData = null;


  if (type === 'students') {
    if (!Array.isArray(data)) { showToast('Invalid format: Expected an array of students.', 'error'); return; }
    let errors = 0, duplicates = 0;
    const existingRolls = new Set(DB.students.map(s => s.roll));
    processedData = data.map((s, i) => {
      if (!s.name || typeof s.name !== 'string') { errors++; return null; }
      let roll = s.roll ? parseInt(s.roll) : (i + 1);
      if (existingRolls.has(roll)) { duplicates++; }
      let batch = s.batch;
      if (!['A', 'B', 'None'].includes(batch)) {
        batch = roll <= 28 ? 'A' : 'B';
      }
      return { roll, name: s.name.toUpperCase(), batch };
    }).filter(Boolean);
    
    isValid = errors === 0;
    previewDetails = {
      'Students Found': data.length,
      'Valid Entries': processedData.length,
      'Duplicates': duplicates,
      'Errors': errors
    };
  } 
  else if (type === 'subjects') {
    if (!Array.isArray(data)) { showToast('Invalid format: Expected an array of subjects.', 'error'); return; }
    let errors = 0, duplicates = 0, teacherCount = 0;
    const existingIds = new Set(DB.subjects.map(s => s.id));
    const existingNames = new Set(DB.subjects.map(s => s.name.toLowerCase()));
    
    processedData = data.map(sub => {
      if (!sub.name) { errors++; return null; }
      if (existingIds.has(sub.id) || existingNames.has(sub.name.toLowerCase())) { duplicates++; }
      const teachers = Array.isArray(sub.teachers) ? sub.teachers : [];
      teacherCount += teachers.length;
      return { id: sub.id || uid(), name: sub.name, teachers };
    }).filter(Boolean);
    
    isValid = errors === 0;
    previewDetails = {
      'Subjects Found': data.length,
      'Teachers Found': teacherCount,
      'Duplicates': duplicates,
      'Errors': errors
    };
  } 
  else if (type === 'timetable') {
    if (typeof data !== 'object' || data === null || Array.isArray(data)) { showToast('Invalid format: Expected a timetable object.', 'error'); return; }
    const validDays = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    let errors = 0;
    let lectureCount = 0;
    const existingSubjectIds = new Set(DB.subjects.map(s => s.id));
    
    processedData = {};
    validDays.forEach(day => {
      if (Array.isArray(data[day])) {
        processedData[day] = data[day].map((lec, idx) => {
          if (!lec.startTime || !lec.endTime || !lec.subjectId) {
            errors++;
            showToast(`Error in ${day} Lecture ${idx+1}: Missing fields.`, 'error');
            return null;
          }
          if (!existingSubjectIds.has(lec.subjectId)) {
            errors++;
            showToast(`Error in ${day} Lecture ${idx+1}: Invalid subjectId.`, 'error');
            return null;
          }
          lectureCount++;
          return {
            startTime: lec.startTime,
            endTime: lec.endTime,
            subjectId: lec.subjectId,
            teacher: Array.isArray(lec.teachers) ? lec.teachers[0] : lec.teacher,
            type: lec.type || 'Theory',
            batch: lec.batch || 'Both'
          };
        }).filter(Boolean);
      }
    });
    
    isValid = errors === 0;
    previewDetails = {
      'Days Found': Object.keys(data).filter(d => validDays.includes(d)).length,
      'Lectures Found': lectureCount,
      'Errors': errors
    };
  } 
  else if (type === 'backup') {
    if (typeof data !== 'object' || data === null || !data.students || !data.subjects || !data.timetable) {
      showToast('This is not a complete backup file. Please use Subject Import, Timetable Import, or Student Import instead.', 'error');
      return;
    }
    isValid = true;
    processedData = data;
    previewDetails = {
      'Students': data.students.length,
      'Subjects': data.subjects.length,
      'Attendance Records': Object.values(data.attendance || {}).reduce((acc, arr) => acc + arr.length, 0)
    };
  }


  if (!isValid) {
    showToast('Validation failed. Please fix errors in your JSON file.', 'error');
    return;
  }


  showImportPreviewModal(type, processedData, previewDetails);
}


function showImportPreviewModal(type, data, details) {
  const modal = document.getElementById('modal-content');
  let detailsHtml = Object.keys(details).map(k => `<div class="stat-row"><span class="lbl">${k}</span><span class="val">${details[k]}</span></div>`).join('');
  
  modal.innerHTML = `
    <div class="modal-header"><h2>Import Preview</h2><button class="modal-close" id="modal-close-btn">✕</button></div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:8px">Data Summary:</div>
      ${detailsHtml}
    </div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:8px">Choose Import Method:</div>
      <button class="btn-sm btn-primary" id="merge-btn" style="width:100%;padding:12px;margin-bottom:8px">Merge with Existing</button>
      <button class="btn-sm btn-danger" id="replace-btn" style="width:100%;padding:12px">Replace Existing Data</button>
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('active');
  document.getElementById('modal-close-btn').addEventListener('click', closeModal);
  
  document.getElementById('merge-btn').addEventListener('click', () => executeImport(type, data, 'merge'));
  document.getElementById('replace-btn').addEventListener('click', () => executeImport(type, data, 'replace'));
}


function executeImport(type, data, mode) {
  if (type === 'students') {
    if (mode === 'replace') DB.students = [];
    const existingRolls = new Set(DB.students.map(s => s.roll));
    data.forEach(s => {
      if (mode === 'merge' && existingRolls.has(s.roll)) return;
      DB.students.push(s);
    });
    DB.students.sort((a,b) => a.roll - b.roll);
  } 
  else if (type === 'subjects') {
    if (mode === 'replace') DB.subjects = [];
    const existingIds = new Set(DB.subjects.map(s => s.id));
    const existingNames = new Set(DB.subjects.map(s => s.name.toLowerCase()));
    data.forEach(sub => {
      if (mode === 'merge') {
        if (existingIds.has(sub.id) || existingNames.has(sub.name.toLowerCase())) {
          const existing = DB.subjects.find(s => s.id === sub.id || s.name.toLowerCase() === sub.name.toLowerCase());
          sub.teachers.forEach(t => {
            if (!existing.teachers.includes(t)) existing.teachers.push(t);
          });
          return;
        }
      }
      DB.subjects.push(sub);
    });
  } 
  else if (type === 'timetable') {
    if (mode === 'replace') DB.timetable = {};
    Object.keys(data).forEach(day => {
      if (mode === 'merge') {
        DB.timetable[day] = [...(DB.timetable[day] || []), ...data[day]];
      } else {
        DB.timetable[day] = data[day];
      }
    });
  } 
  else if (type === 'backup') {
    DB = data;
  }
  
  saveDB(true);
  closeModal();
  showToast(`✓ ${type.charAt(0).toUpperCase() + type.slice(1)} imported successfully!`, 'success');
  
  // Re-render active views
  if (AppState.currentView === 'home') renderHome();
  if (AppState.currentView === 'setup') renderSetup();
  if (AppState.currentView === 'attendance') renderAttendanceView();
}

  if (!sessionStorage.getItem('welcome_shown')) { setTimeout(() => showToast('Welcome to CR Attendance Pro 3.0!', 'success'), 500); sessionStorage.setItem('welcome_shown', '1'); }
}


if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
